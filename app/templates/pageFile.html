{% extends 'base.html' %}

{% block content %}

    <form action="/export" method="get">
        <button type="submit">Экспорт</button>
    </form> <br>
    <hr>
    <br>
    <label for="fileInput">Выберите файл для импорта:</label>
    <form action="/upload" method="post"  enctype="multipart/form-data">
        <input type="file" id="fileInput" name="fileInput" accept=".xlsx">
        <button type="submit">Импорт</button>
    </form>
{% endblock content %}
