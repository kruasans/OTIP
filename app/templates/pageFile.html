{% extends 'base.html' %}

{% block content %}

    <form action="/export" method="get">
        <button type="submit">Экспорт</button>
    </form> <br>
    <hr>
    <br>
    <label for="fileinput">Выберите файл для импорта:</label>
    <input type="file" id="fileinput" name="file" accept=".xlsx, .xls, .csv">
    <br><br>
    <button type="submit" onclick="upload(document.getElementById('fileinput').files[0].name)">Импорт</button>

{% endblock content %}
